services:
  app:
    build:
      context: .
    image: subway-tracker:local
    env_file:
      - path: .env
        required: true
    environment:
      DB_PATH: /app/data/tracker.db
      STATIONS_CSV: /app/data/stations.csv
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SUBWAY_API_URL: ${SUBWAY_API_URL:-http://subway-api:8000}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-15}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4318}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-subway-tracker}
      OTEL_EXPORT_TIMEOUT_SECONDS: ${OTEL_EXPORT_TIMEOUT_SECONDS:-5}
      OTEL_METRIC_EXPORT_INTERVAL_MILLIS: ${OTEL_METRIC_EXPORT_INTERVAL_MILLIS:-10000}
    ports:
      - "8081:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - default
      - subway_default

networks:
  subway_default:
    external: true
