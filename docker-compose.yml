services:
  app:
    build:
      context: .
    image: subway-tracker:local
    env_file:
      - path: .env
        required: true
    environment:
      DB_PATH: /app/data/tracker.db
      STATIONS_CSV: /app/data/stations.csv
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-15}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - app-logs:/var/log/subway-tracker
    depends_on:
      loki:
        condition: service_started
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.2
    command: -config.file=/etc/loki/config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.3.2
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./docker/promtail/config.yml:/etc/promtail/config.yml:ro
      - app-logs:/var/log/subway-tracker:ro
      - promtail-positions:/tmp
    depends_on:
      app:
        condition: service_started
      loki:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: light
    ports:
      - "3000:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_started
    restart: unless-stopped

volumes:
  app-logs:
  grafana-data:
  loki-data:
  promtail-positions:
